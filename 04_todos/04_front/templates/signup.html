{% extends "base.html" %}

{% block contents %}
<div class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center p-4">
    <div class="bg-white rounded-lg shadow-lg p-8 w-full max-w-md">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">회원가입</h1>
            <p class="text-gray-600">새로운 계정을 만들어보세요</p>
        </div>

        <!-- Form -->
        <form class="space-y-5">
            <!-- Username Input -->
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700 mb-2">
                    사용자명
                </label>
                <input
                    type="text"
                    id="username"
                    placeholder="사용자명을 입력하세요"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                    required
                />
            </div>

            <!-- Email Input -->
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
                    이메일
                </label>
                <input
                    type="email"
                    id="email"
                    placeholder="이메일을 입력하세요"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                    required
                />
            </div>

            <!-- Password Input -->
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                    비밀번호
                </label>
                <input
                    type="password"
                    id="password"
                    placeholder="비밀번호를 입력하세요"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                    required
                />
            </div>

            <!-- Confirm Password Input -->
            <div>
                <label for="confirm_password" class="block text-sm font-medium text-gray-700 mb-2">
                    비밀번호 확인
                </label>
                <input
                    type="password"
                    id="confirm_password"
                    placeholder="비밀번호를 다시 입력하세요"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                    required
                />
            </div>

            <!-- Terms Checkbox -->
            <div class="flex items-center">
                <input
                    type="checkbox"
                    id="terms"
                    class="w-4 h-4 text-blue-600 rounded focus:ring-2 focus:ring-blue-500"
                    required
                />
                <label for="terms" class="ml-2 text-sm text-gray-600">
                    이용약관에 동의합니다
                </label>
            </div>

            <!-- Sign Up Button -->
            <button
                type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg transition duration-200 mt-6"
            >
                가입하기
            </button>
        </form>

        <!-- Divider -->
        <div class="relative my-6">
            <div class="absolute inset-0 flex items-center">
                <div class="w-full border-t border-gray-300"></div>
            </div>
            <div class="relative flex justify-center text-sm">
                <span class="px-2 bg-white text-gray-500">또는</span>
            </div>
        </div>

        <!-- Login Link -->
        <p class="text-center text-gray-600">
            이미 계정이 있으신가요?
            <a href="/login" class="text-blue-600 hover:text-blue-700 font-medium">
                로그인
            </a>
        </p>
    </div>
</div>
{% endblock %}
